spring.application.name=system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:hospital-management-local-dev-secret-key-123456789012}
